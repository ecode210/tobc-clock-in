services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: clockin
      POSTGRES_PASSWORD: clockin
      POSTGRES_DB: clockin
    ports:
      - "5433:5432"
    volumes:
      - clockin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clockin -d clockin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clockin_pgdata:
